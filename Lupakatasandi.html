<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Figmentia</title>
    <link rel="icon" href="../Gambar/Logo2.png" type="image/png">
    <link rel="stylesheet" href="../Css/Stylelogin.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">

            <div class="jam-container-internal">
                <div id="jam-jalan">🕒 Memuat Waktu...</div>
            </div>

            <div class="logo-placeholder">
                <img src="../Gambar/Logo2.png" alt="Figmentia Logo">
                <p>RESET PASSWORD</p>
            </div>
            
            <p class="instruction-text">
                Enter your email address and we'll send you a link to reset your password.
            </p>

            <form action="#">
                <input type="email" placeholder="Email Address" required>

                <button type="submit" class="login-button">SEND RESET LINK</button>
            </form>

            <p class="signup-text">
                <a href="index.html">Back to Log In</a>
            </p>
            
        </div>
    </div>

    <div id="footer">
        <p>&copy; CopyRight <b>Fahmi Riquelme</b> | NIM 251011700189 | 01SIFP003 - 2025</p>
    </div>

    <script src="../JS/Script.js"></script>

</body>
</html>
